services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crudfab
      POSTGRES_PASSWORD: crudfab
      POSTGRES_DB: crudfab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crudfab"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://crudfab:crudfab@db:5432/crudfab
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALGORITHM: HS256
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_PERSON_COUNT: ${SEED_PERSON_COUNT:-1000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3800:80"
    depends_on:
      - backend

volumes:
  pgdata:
